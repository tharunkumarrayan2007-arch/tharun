<!DOCTYPE html>
<html>
<head>
  <title>Login Page</title>
  <style>
    body { 
      font-family: Arial; 
      background: white; 
    }
    .login { 
      width:300px; 
      margin:100px auto; 
      padding:25px;
      background:white; 
      border-radius:10px; }
    input, button { 
      width:100%; 
      padding:10px; 
      margin:8px 0; }
    button { 
      background:#007bff; 
      color:white; 
      border:0; 
    }
  </style>
</head>
<body>
  <div class="login">
    <h2>Login</h2>
    <form>
      <input type="text" placeholder="Email" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
